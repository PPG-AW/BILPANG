<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#6d28d9" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="description" content="EksponenKu — generator latihan soal sifat-sifat bilangan berpangkat dengan pembahasan, terhubung Google Sheets." />
<title>EksponenKu — Latihan Bilangan Berpangkat</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#eef1fb; --card:#ffffff; --ink:#17203a; --muted:#6b7694;
  --pri:#6d28d9; --pri2:#4f46e5; --grad:linear-gradient(135deg,#7c3aed,#4f46e5);
  --ok:#16a34a; --no:#dc2626; --line:#e4e8f4;
  --rad:20px; --shadow:0 6px 24px rgba(23,32,58,.08);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  background:#dfe4f5; color:var(--ink); min-height:100dvh; display:flex; justify-content:center;
  line-height:1.55;
}
#app{
  width:100%; max-width:480px; min-height:100dvh; position:relative;
  background:linear-gradient(180deg,#ece9fd 0,#f6f7fd 260px,#f6f7fd 100%);
  box-shadow:0 0 40px rgba(23,32,58,.10);
}
main{padding:18px 16px 110px}
h1{font-size:22px;line-height:1.25}
h2.sect{font-size:17px;margin:20px 2px 12px;font-weight:800}
h3.sect{font-size:15px;margin:18px 2px 10px}
.muted{color:var(--muted)} .small{font-size:12px}
.mt{margin-top:12px}
.mono{font-family:ui-monospace,monospace;font-size:12px}

/* ---------- HERO ---------- */
.hero{
  background:var(--grad); border-radius:26px; color:#fff; padding:24px 20px;
  box-shadow:0 14px 30px rgba(109,40,217,.32); position:relative; overflow:hidden;
}
.hero::after{
  content:"x² × x³"; position:absolute; right:-4px; top:8px; font-weight:800;
  font-size:15px; opacity:.18; transform:rotate(-8deg);
}
.hero::before{
  content:"a⁰=1"; position:absolute; right:16px; bottom:10px; font-weight:800;
  font-size:13px; opacity:.15; transform:rotate(6deg);
}
.hero .hi{font-size:13px;opacity:.92;font-weight:600}
.hero h1{margin:6px 0 8px}
.hero h1 span{color:#fde68a}
.hero .sub{font-size:13px;opacity:.9;max-width:88%}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;
  background:#fff;border:1.5px solid var(--line);font-size:12.5px;font-weight:700;color:var(--ink);
}
.chip.soft{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.25);color:#fff}
.chip.pick{cursor:pointer;font-family:inherit}
.chip.pick.on{background:var(--grad);color:#fff;border-color:transparent}

/* ---------- GRID TOPIK ---------- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tcard{
  background:var(--card);border:1px solid var(--line);border-radius:var(--rad);
  padding:16px 14px;text-align:left;cursor:pointer;font-family:inherit;
  display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);
  transition:transform .12s ease, box-shadow .2s;
}
.tcard:active{transform:scale(.96)}
.tico{
  width:44px;height:44px;border-radius:14px;display:inline-flex;align-items:center;
  justify-content:center;font-size:22px;margin-bottom:2px;
}
.tico.lg{width:52px;height:52px;font-size:26px;flex:none}
.tlabel{font-weight:800;font-size:13.5px;line-height:1.3}
.tdesc{font-size:11.5px;color:var(--muted)}
.tip{
  margin-top:16px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;
  padding:12px 14px;border-radius:16px;font-size:12.5px;
}

/* ---------- SHEET ---------- */
#scrim{
  position:fixed;inset:0;background:rgba(15,22,42,.5);display:none;
  align-items:flex-end;justify-content:center;z-index:60;backdrop-filter:blur(2px);
}
#scrim.open{display:flex}
.sheet{
  width:100%;max-width:480px;background:#fff;border-radius:26px 26px 0 0;
  padding:22px 20px calc(22px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.9,.3,1.2);
  max-height:86dvh;overflow-y:auto;
}
@keyframes up{from{transform:translateY(60%);opacity:.4}to{transform:none;opacity:1}}
.sheet-head{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.sheet-head h3{font-size:16px}
.rumus{
  background:#f1f0ff;border:1.5px dashed #c7c2f9;color:#4338ca;font-size:13.5px;
  padding:12px 14px;border-radius:16px;margin-bottom:6px;
}
.rumus.big{font-size:15px;background:#eef2ff}
.lbl{font-size:12.5px;font-weight:800;color:var(--muted);margin:14px 2px 8px;text-transform:uppercase;letter-spacing:.04em}
.seg{display:flex;background:#eef1fb;border-radius:14px;padding:4px;gap:4px}
.seg button{
  flex:1;padding:10px 0;border:none;border-radius:10px;font-family:inherit;font-weight:700;
  font-size:13px;color:var(--muted);background:transparent;cursor:pointer;
}
.seg button.on{background:#fff;color:var(--pri);box-shadow:0 2px 8px rgba(23,32,58,.12)}
.chiprow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}

/* ---------- BUTTON ---------- */
.btn{
  border:none;font-family:inherit;font-weight:800;font-size:15px;cursor:pointer;
  padding:15px 18px;border-radius:16px;transition:transform .1s, filter .2s;
}
.btn:active{transform:scale(.97)}
.btn.block{width:100%}
.btn.pri{background:var(--grad);color:#fff;box-shadow:0 8px 18px rgba(109,40,217,.32)}
.btn.ok{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff}
.btn.ghost{background:#eef1fb;color:var(--ink)}
.btn.danger{background:#fef2f2;color:#dc2626}
.btn.sm{padding:11px 14px;font-size:13.5px}
.row2{display:flex;gap:10px}.row2>.btn{flex:1}

/* ---------- KUIS ---------- */
.qtop{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.icobtn{
  width:38px;height:38px;border-radius:12px;border:none;background:#fff;color:var(--muted);
  font-size:16px;cursor:pointer;box-shadow:var(--shadow);flex:none;
}
.qmeta{flex:1;display:flex;flex-direction:column;line-height:1.3}
.qmeta b{font-size:14px}.qmeta span{font-size:11.5px}
.pbar{height:8px;background:#e4e8f4;border-radius:99px;overflow:hidden;margin-bottom:16px}
.pfill{height:100%;background:var(--grad);border-radius:99px;transition:width .35s ease}
.qcard{
  background:#fff;border-radius:22px;padding:22px 18px;box-shadow:var(--shadow);
  border:1px solid var(--line);
}
.qtext{font-size:21px;font-weight:700;text-align:center;padding:10px 4px 16px;line-height:1.7}
.hint{
  font-size:12px;color:#92400e;background:#fffbeb;border:1px solid #fde68a;
  padding:8px 12px;border-radius:12px;margin-bottom:14px;text-align:center;
}
.ainput{
  width:100%;font-family:inherit;font-size:19px;font-weight:700;text-align:center;
  padding:16px 14px;border-radius:16px;border:2px solid var(--line);outline:none;color:var(--ink);
}
.ainput.sm{font-size:14px;font-weight:600;text-align:left;padding:13px 14px;margin:2px 0 4px}
.ainput:focus{border-color:var(--pri);box-shadow:0 0 0 4px rgba(109,40,217,.12)}
.ainput:disabled{background:#f4f6fc;color:var(--muted)}
.ainput.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.keyrow{display:flex;gap:7px;margin:10px 0 16px;flex-wrap:wrap;justify-content:center}
.kchip{
  min-width:42px;padding:9px 12px;border-radius:12px;border:1.5px solid var(--line);
  background:#f8faff;font-weight:800;font-size:15px;color:#4338ca;cursor:pointer;font-family:inherit;
}
.kchip.del{color:#dc2626}
.fb{margin-top:16px;border-radius:18px;padding:16px;animation:up .25s ease}
.fb.ok{background:#ecfdf5;border:1.5px solid #86efac}
.fb.no{background:#fef2f2;border:1.5px solid #fecaca}
.fb-head{font-weight:800;font-size:16px;margin-bottom:6px}
.fb.no .fb-head{color:#b91c1c}.fb.ok .fb-head{color:#15803d}
.fb-key{font-size:15px;margin-bottom:4px}
.steps{margin-top:10px}
.steps summary{
  cursor:pointer;font-weight:800;font-size:13px;color:var(--pri2);list-style:none;
  padding:6px 0;user-select:none;
}
.steps summary::before{content:"▸ ";font-size:11px}
.steps[open] summary::before{content:"▾ "}
.steps ol{margin:8px 0 12px 18px;font-size:14px}
.steps ol li{margin-bottom:8px}
.steps .btn{margin-top:8px}

/* ---------- HASIL ---------- */
.rcard{
  background:#fff;border-radius:26px;padding:26px 20px;text-align:center;
  box-shadow:var(--shadow);border:1px solid var(--line);
}
.rcard h2{font-size:19px}
.ring{position:relative;width:150px;margin:18px auto 10px}
.ring svg{width:150px;height:150px;transform:rotate(-90deg)}
.ring .rbg{fill:none;stroke:#edf0f9;stroke-width:12}
.ring .rfg{fill:none;stroke:url(#);stroke:#6d28d9;stroke-width:12;stroke-linecap:round;transition:stroke-dasharray 1s ease}
.rval{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.rval b{font-size:36px;line-height:1}
.rval span{font-size:12px;color:var(--muted);font-weight:700}
.stats{display:flex;gap:10px;justify-content:center;margin:10px 0 14px}
.stats div{background:#f6f7fd;border-radius:14px;padding:10px 16px;min-width:76px}
.stats b{display:block;font-size:18px}
.stats span{font-size:11.5px;color:var(--muted);font-weight:700}
.pesan{font-weight:800;margin-bottom:10px}
.kirim{font-size:12.5px;background:#f6f7fd;border-radius:12px;padding:10px;margin-bottom:14px}
.rev{background:#fff;border:1px solid var(--line);border-radius:16px;margin-bottom:8px;overflow:hidden}
.rev summary{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;list-style:none}
.rev .rno{
  width:26px;height:26px;border-radius:8px;background:#eef1fb;font-weight:800;font-size:12.5px;
  display:inline-flex;align-items:center;justify-content:center;flex:none;
}
.rev .rq{flex:1;font-size:13.5px}
.rev .rmark{font-weight:800;flex:none}
.rev.ok .rmark{color:var(--ok)}.rev.no .rmark{color:var(--no)}
.rev.no{border-left:4px solid var(--no)}.rev.ok{border-left:4px solid var(--ok)}
.rbody{padding:2px 16px 14px;font-size:13.5px}
.rbody ol{margin:6px 0 0 18px}
.rbody li{margin-bottom:6px}

/* ---------- CONTOH ---------- */
.scroller{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.tpc{flex:none}
.ccard{
  background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;
  margin-bottom:12px;box-shadow:var(--shadow);
}
.cno{font-size:11px;font-weight:800;color:var(--pri);text-transform:uppercase;letter-spacing:.06em}
.csoal{font-size:20px;font-weight:700;text-align:center;padding:12px 0 8px;line-height:1.7}
.cjawab{
  margin-top:4px;background:#ecfdf5;border:1px solid #86efac;color:#166534;
  padding:10px 12px;border-radius:12px;font-size:14px;text-align:center;
}

/* ---------- RIWAYAT ---------- */
.hcard{
  background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 16px;
  display:flex;gap:12px;align-items:center;margin-bottom:10px;box-shadow:var(--shadow);
}
.hleft{flex:1;display:flex;flex-direction:column;gap:2px;font-size:13.5px}
.hleft .muted{font-size:12px}
.hright{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.badge{
  min-width:46px;text-align:center;font-weight:800;font-size:16px;padding:6px 10px;border-radius:12px;
}
.badge.g{background:#ecfdf5;color:#15803d}.badge.y{background:#fffbeb;color:#b45309}.badge.r{background:#fef2f2;color:#b91c1c}
.sent{font-size:11px;font-weight:800;color:#15803d}
.mini{
  border:none;background:#eef1fb;color:var(--pri2);font-weight:800;font-size:11.5px;
  padding:7px 10px;border-radius:10px;cursor:pointer;font-family:inherit;
}
.empty{text-align:center;padding:44px 20px;color:var(--ink)}
.empty .eico{font-size:44px;margin-bottom:10px}
.empty .btn{margin-top:14px}

/* ---------- PENGATURAN ---------- */
.card{
  background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;
  margin-bottom:14px;box-shadow:var(--shadow);
}
.foot{text-align:center;font-size:11.5px;color:var(--muted);margin:18px 0}

/* ---------- NAV BAWAH ---------- */
#bottomnav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
  display:grid;grid-template-columns:repeat(4,1fr);z-index:50;
  background:rgba(255,255,255,.92);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));
}
#bottomnav button{
  border:none;background:none;font-family:inherit;display:flex;flex-direction:column;
  align-items:center;gap:2px;padding:7px 0;color:var(--muted);font-size:10.5px;font-weight:700;
  cursor:pointer;border-radius:14px;
}
#bottomnav button svg{width:22px;height:22px;fill:currentColor}
#bottomnav button.act{color:var(--pri)}
body.quizmode #bottomnav{display:none}

/* ---------- TOAST ---------- */
#toast{
  position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(20px);
  background:#1e293b;color:#fff;padding:12px 18px;border-radius:14px;font-size:13.5px;
  font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:88%;
  text-align:center;box-shadow:0 10px 24px rgba(0,0,0,.25);
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- ONBOARD ---------- */
#onboard{
  position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;
  background:radial-gradient(120% 100% at 50% 0,#7c3aed,#312e81);padding:20px;
}
#onboard.show{display:flex}
.ocard{
  width:100%;max-width:380px;background:#fff;border-radius:26px;padding:28px 22px;
  text-align:center;animation:up .35s ease;
}
.ologo{
  width:64px;height:64px;border-radius:20px;background:var(--grad);color:#fff;font-size:32px;
  display:flex;align-items:center;justify-content:center;margin:0 auto 14px;
  box-shadow:0 10px 24px rgba(109,40,217,.4);
}
.ocard h2{font-size:19px;margin-bottom:4px}
.ocard h2 span{color:var(--pri)}
.ocard p{font-size:13px;margin-bottom:16px}
.ocard .ainput{margin-bottom:10px;text-align:center}
.ocard .btn{margin-top:6px}

/* ---------- MATEMATIKA ---------- */
sup{font-size:.62em;font-weight:800}
.pw{white-space:nowrap}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .18em;font-size:.88em}
.frac>.fn{border-bottom:2px solid currentColor;padding:0 .32em;line-height:1.25}
.frac>.fd{padding:0 .32em;line-height:1.25}

@media (min-width:640px){
  body{padding:28px 0}
  #app{border-radius:32px;min-height:calc(100dvh - 56px);overflow:hidden}
  #bottomnav{border-radius:0 0 32px 32px;overflow:hidden}
}
</style>
</head>
<body>
<div id="app">
  <main id="view"></main>

  <nav id="bottomnav">
    <button data-tab="beranda" class="act">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      Beranda
    </button>
    <button data-tab="contoh">
      <svg viewBox="0 0 24 24"><path d="M21 5c-1.1-.35-2.3-.5-3.5-.5-1.95 0-4.05.4-5.5 1.5-1.45-1.1-3.55-1.5-5.5-1.5S2.45 4.9 1 6v14.65c0 .25.25.5.5.5.1 0 .15-.05.25-.05C3.1 20.45 5.05 20 6.5 20c1.95 0 4.05.4 5.5 1.5 1.35-.85 3.8-1.5 5.5-1.5 1.65 0 3.35.3 4.75 1.05.1.05.15.05.25.05.25 0 .5-.25.5-.5V6c-.6-.45-1.25-.75-2-1z"/></svg>
      Contoh
    </button>
    <button data-tab="riwayat">
      <svg viewBox="0 0 24 24"><path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6a7 7 0 1 1 7 7 6.96 6.96 0 0 1-4.95-2.05l-1.41 1.41A8.96 8.96 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8z"/></svg>
      Riwayat
    </button>
    <button data-tab="pengaturan">
      <svg viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm9.4 4a7.4 7.4 0 0 0-.1-1.2l2-1.6-2-3.4-2.3.9a7.6 7.6 0 0 0-2.1-1.2L16.5 2h-5l-.4 2.5a7.6 7.6 0 0 0-2.1 1.2l-2.3-.9-2 3.4 2 1.6a7.4 7.4 0 0 0 0 2.4l-2 1.6 2 3.4 2.3-.9c.6.5 1.3.9 2.1 1.2l.4 2.5h5l.4-2.5c.8-.3 1.5-.7 2.1-1.2l2.3.9 2-3.4-2-1.6c.06-.4.1-.8.1-1.2z"/></svg>
      Pengaturan
    </button>
  </nav>
</div>

<div id="scrim"><div class="sheet" id="sheetBody"></div></div>
<div id="toast"></div>
<div id="onboard"></div>
